<!DOCTYPE html>
<html>
<head>
  <title>Organic Cafe</title>
  <meta charset="UTF-8">
  <meta name="description" content="Organic Cafeは自家焙煎コーヒーが買えるお店です。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ヘッダー -->
  <header>
    <!-- ロゴ -->
    <a href="index.html" id="logo"><img src="images/logo.png" alt="トップページに戻る"></a>

    <!-- PC用ナビゲーション -->
    <nav id="nav-pc">
       <ul>
        <li><a href="#concept">CONCEPT</a></li>
        <li><a href="#product">PRODUCT</a></li>
        <li><a href="#contact">CONTACT</a></li>
       </ul>
   </nav>

   <!-- スマホ用ハンバーガーメニューボタン -->
   <img id="menu-sp" src="images/button-menu.png" alt="ナビゲーションを開く" onclick="document.getElementById('nav-sp').style.display = 'block'">

   <!-- スマホ用ナビゲーション -->
   <nav id="nav-sp">
     <img id="close" src="images/button-close.png" alt="ナビゲーションを閉じる" onclick="document.getElementById('nav-sp').style.display = 'none'">
     <nav>
       <ul>
         <li>
           <a id="logo-sp" href="index.html" onclick="document.getElementById('nav-sp').style.display = 'none'"><img src="images/logo-sp.png" alt="Organic Cafeトップページ"></a>
         </li>
         <li><a href="#concept" onclick="document.getElementById('nav-sp').style.display = 'none'">CONCEPT</a></li>
         <li><a href="#product" onclick="document.getElementById('nav-sp').style.display = 'none'">PRODUCT</a></li>
         <li><a href="#contact" onclick="document.getElementById('nav-sp').style.display = 'none'">CONTACT</a></li>
       </ul>
     </nav>
   </nav>
  </header>

  <!-- メインビジュアル（テキストが写真の上ではなく外側にくる構成） -->
  <main>
    <div id="main-visual">
      <div id="main-message">
        <h1>Organic Cafe</h1>
        <p>自家焙煎コーヒーが買えるお店</p>
      </div>
      <img src="images/main-image.jpg" alt="コーヒーを淹れている様子">
    </div>
  </main>
</body>
</html>
